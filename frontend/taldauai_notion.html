<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="TaldauAI — локальный интерактивный прототип рабочего пространства для проверки протоколов совещаний.">
  <title>TaldauAI — рабочее пространство</title>
  <style>/* TaldauAI • document-first monochrome UI. All colors use equal RGB channels. */
:root{
  --paper:#fff; --sidebar:#f8f8f8; --soft:#f7f7f7; --hover:#f0f0f0;
  --selected:#eaeaea; --ink:#2b2b2b; --black:#202020; --muted:#737373;
  --faint:#929292; --line:#e9e9e9; --strong-line:#d9d9d9;
  --sidebar-w:236px; --source-w:420px; --radius:5px;
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --shadow:0 12px 36px #0000000d,0 3px 8px #00000008;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.38}
button,a,input,select,textarea,[tabindex]{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #555;outline-offset:3px;border-radius:3px}
input,textarea{accent-color:#333}
input[type="checkbox"]{width:15px;height:15px;cursor:pointer;flex:none}
input[type="range"]{accent-color:#333;width:100%}
textarea{resize:vertical}
a{color:inherit}
button svg, .icon{width:18px;height:18px;flex-shrink:0;vertical-align:middle}
.icon{stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1{font-size:38px;line-height:1.18;letter-spacing:-1.1px;font-weight:700}
h2{font-size:19px;line-height:1.4;letter-spacing:-.3px;font-weight:650}
h3{font-size:15px;line-height:1.4;font-weight:650}
.muted{color:var(--muted)}
.small{font-size:12px}
.tabular{font-variant-numeric:tabular-nums}
.flex{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowrap{white-space:nowrap}
.skip-link{position:fixed;top:-60px;left:16px;z-index:1000;background:var(--black);color:#fff;padding:10px 18px;border-radius:5px}
.skip-link:focus{top:12px}
/* Sidebar */
.sidebar{width:var(--sidebar-w);position:fixed;inset:0 auto 0 0;background:var(--sidebar);display:flex;flex-direction:column;padding:12px 9px 10px;z-index:40;border-right:1px solid #f1f1f1;transition:transform .2s}
.workspace-name{display:flex;align-items:center;gap:9px;padding:5px 8px;margin-bottom:17px;min-height:32px}
.wordmark{font-size:15px;font-weight:680;letter-spacing:-.4px}
.logo-mark{width:24px;height:25px;border:1.6px solid var(--ink);border-radius:4px;background:white;display:grid;place-items:center;font-family:Georgia,serif;font-size:19px;font-weight:700;line-height:1}
.sidebar-collapse{margin-left:auto;opacity:0;color:var(--muted)}
.sidebar:hover .sidebar-collapse,.sidebar-collapse:focus-visible{opacity:1}
.nav-group{margin-bottom:24px}
.nav-item{width:100%;min-height:32px;display:flex;align-items:center;gap:9px;text-align:left;padding:5px 10px;border-radius:5px;color:#656565;font-size:13px;line-height:1.4;margin:1px 0}
.nav-item .icon{width:17px;height:17px;stroke-width:1.65}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--selected);color:var(--ink);font-weight:550}
.nav-item .shortcut{margin-left:auto;font-size:10px;color:#777;border:1px solid #dedede;border-radius:3px;padding:0 4px;line-height:17px}
.nav-section-title{font-size:11px;font-weight:550;color:#767676;padding:0 10px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.nav-count{margin-left:auto;color:#787878;font-size:11px;font-variant-numeric:tabular-nums}
.recent .nav-item{font-size:12px;gap:8px;padding-left:11px;min-height:31px}
.sidebar-bottom{margin-top:auto}
.local-note{font-size:11px;display:flex;align-items:center;gap:7px;color:#747474;padding:11px 10px 0;margin-top:9px;border-top:1px solid var(--line)}
.local-note .icon{width:13px;height:13px}
.profile-row{display:flex;gap:8px;align-items:center;padding:10px 9px 3px;font-size:12px}
.profile-initials{width:23px;height:23px;display:grid;place-items:center;font-size:10px;font-weight:600;background:#e9e9e9;border-radius:4px}
/* Frame and controls */
.app-shell{margin-left:var(--sidebar-w);min-height:100vh;transition:margin .2s}
.topbar{height:47px;display:flex;align-items:center;gap:10px;padding:0 21px;position:sticky;top:0;background:#fffffff5;z-index:20;font-size:12px}
.breadcrumbs{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.breadcrumbs .icon{width:15px;height:15px;color:#787878}
.crumb{border-radius:4px;padding:3px 5px;white-space:nowrap;color:#606060;font-size:12px}
.crumb:hover{background:var(--hover)}
.crumb-current{max-width:310px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slash{color:#b0b0b0}
.topbar-tools{display:flex;align-items:center;gap:5px;flex-shrink:0}
.save-status{color:#767676;font-size:11px;margin-right:9px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.save-status .icon{width:13px;height:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:31px;padding:5px 10px;border-radius:var(--radius);font-size:12px;font-weight:500;line-height:1.45;white-space:nowrap;transition:background .12s}
.btn .icon{width:15px;height:15px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--black);color:#fff;border:1px solid var(--black);box-shadow:0 1px 2px #00000008}
.btn.primary:hover{background:#444;border-color:#444}
.btn.secondary{border:1px solid var(--strong-line);background:#fff;box-shadow:0 1px 2px #00000003}
.btn.secondary:hover{background:#f7f7f7}
.btn.tertiary{color:var(--muted);padding-left:6px;padding-right:6px}
.btn.small-btn{min-height:26px;padding:3px 7px;font-size:11px}
.btn.large-btn{min-height:36px;padding:7px 13px;font-size:13px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:4px;color:#767676;flex-shrink:0}
.icon-btn .icon{width:17px;height:17px}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn.is-on{color:var(--ink);background:var(--hover)}
.icon-btn.is-on .star-icon{fill:#444}
.menu-wrap{position:relative}
.dropdown{position:absolute;right:0;top:calc(100% + 5px);width:238px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px;box-shadow:var(--shadow);z-index:90}
.dropdown button{width:100%;display:flex;align-items:center;gap:9px;padding:7px 8px;text-align:left;border-radius:4px;font-size:12px}
.dropdown button:hover{background:var(--hover)}
.dropdown .icon{width:16px;height:16px;color:#777}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
.mobile-toggle,.desktop-open-sidebar{display:none}
body.sidebar-hidden .sidebar{transform:translateX(-100%)}
body.sidebar-hidden .app-shell{margin-left:0}
body.sidebar-hidden .desktop-open-sidebar{display:inline-flex}
/* Pages */
.page{max-width:936px;padding:53px 46px 96px;margin:0 auto}
.page.database-page{max-width:1270px;padding:63px 54px 100px}
.page.form-page{max-width:860px}
.page-icon{color:#3c3c3c;width:44px;height:47px;display:flex;align-items:center;margin-bottom:17px}
.page-icon .icon{width:43px;height:43px;stroke-width:1.35}
.page-title{max-width:735px;overflow-wrap:anywhere}
.page-description{margin-top:11px;color:var(--muted);font-size:14px;line-height:1.6;max-width:650px}
.page-context{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:12px}
.page-context .icon{width:13px;height:13px}
.properties{margin:23px 0 23px;display:grid;gap:2px;font-size:13px}
.property{display:grid;grid-template-columns:153px minmax(0,1fr);min-height:29px;align-items:start}
.property-name{color:var(--muted);display:flex;align-items:center;gap:8px;padding:4px 0}
.property-name .icon{width:15px;height:15px;stroke-width:1.6}
.property-value{padding:4px 7px;display:flex;align-items:center;gap:8px;min-height:29px;flex-wrap:wrap}
.property-value.is-button{margin-left:0;justify-self:start;border-radius:4px;text-align:left;font-size:13px}
.property-value.is-button:hover{background:var(--hover)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 6px;border-radius:4px;background:#f0f0f0;font-size:11px;line-height:20px;white-space:nowrap;color:#525252;font-weight:450}
.tag .icon{width:12px;height:12px;stroke-width:1.7}
.tag.outline{border:1px solid #dcdcdc;background:#fff;line-height:18px}
.lang-tag{font-size:10px;border:1px solid #e3e3e3;color:#767676;padding:0 4px;border-radius:3px;line-height:17px;letter-spacing:.15px}
.review-callout{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:5px;padding:12px 14px;margin:22px 0 23px;font-size:12px;line-height:1.6}
.review-callout>.icon{width:18px;height:18px;align-self:flex-start;margin-top:3px;color:#555}
.review-callout strong{font-weight:600;color:#404040}
.review-callout p{color:var(--muted);font-size:11px;margin-top:1px}
.review-callout .btn{margin-left:auto}
.review-callout .btn .icon{width:13px;height:13px}
.doc-tabs,.db-tabs{display:flex;align-items:center;gap:19px;border-bottom:1px solid var(--line);margin-bottom:26px}
.tab{position:relative;display:flex;align-items:center;gap:6px;padding:9px 0 10px;color:var(--muted);font-size:13px;line-height:21px;white-space:nowrap}
.tab .icon{width:15px;height:15px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:550}
.tab[aria-selected="true"]::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#373737}
.doc-tabs .right-hint{margin-left:auto;font-size:11px;color:var(--muted)}
.section{margin:0 0 30px;position:relative;scroll-margin-top:70px}
.section-heading{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.section-heading .count{font-size:12px;color:var(--muted);font-weight:400}
.section-actions{margin-left:auto;display:flex;gap:4px;align-items:center}
.section-heading .section-actions .icon-btn{opacity:0}
.section:hover .section-heading .section-actions .icon-btn,.section:focus-within .section-heading .section-actions .icon-btn{opacity:1}
.doc-text{font-size:14px;line-height:1.8;white-space:pre-wrap}
.content-block{position:relative}
.block-grip{position:absolute;left:-26px;top:2px;opacity:0;color:#a5a5a5;pointer-events:none}
.block-grip .icon{width:16px;height:16px}
.content-block:hover .block-grip{opacity:1}
.source-link{display:inline-flex;align-items:center;gap:4px;border-radius:3px;font-size:10px;line-height:18px;padding:0 5px;background:#f1f1f1;color:#686868;vertical-align:baseline;white-space:nowrap;margin-left:4px;font-variant-numeric:tabular-nums;cursor:pointer}
.source-link:hover,.source-link:focus-visible{background:#e5e5e5;color:var(--ink)}
.source-link .icon{width:11px;height:11px}
.source-link.text-link{font-size:11px;background:none;padding:0;margin:0;color:#686868;gap:5px;border-bottom:1px solid #d2d2d2;border-radius:0}
.suggestion-foot{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:#737373;min-height:25px;flex-wrap:wrap}
.suggestion-foot>.icon{width:13px;height:13px}
.suggestion-foot .btn{margin-left:auto}
.verification-note{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-top:8px}
.verification-note .icon{width:12px;height:12px}
/* Action items in a document, not cards */
.action-item{position:relative;border-top:1px solid var(--line);padding:15px 0 14px;scroll-margin-top:70px}
.action-item:last-of-type{border-bottom:1px solid var(--line)}
.action-item.selected{scroll-margin-top:70px}
.action-heading{display:flex;align-items:flex-start;gap:9px}
.item-toggle{width:19px;height:23px;display:flex;align-items:center;justify-content:center;color:#8a8a8a;border-radius:3px;flex-shrink:0}
.item-toggle:hover{background:var(--hover)}
.item-toggle .icon{width:13px;height:13px;transition:transform .15s}
.item-toggle[aria-expanded="true"] .icon{transform:rotate(90deg)}
.action-title{font-weight:550;font-size:14px;line-height:23px;flex:1;min-width:0;text-align:left;padding:0}
.action-title:hover{text-decoration:underline;text-decoration-color:#c6c6c6;text-underline-offset:4px}
.item-index{font-size:10px;color:#8b8b8b;line-height:23px;font-variant-numeric:tabular-nums;padding-right:2px}
.action-meta{margin:6px 0 0 28px;display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:11px;color:#717171}
.action-meta .meta-piece{display:flex;gap:5px;align-items:center}
.action-meta .icon{width:12px;height:12px}
.review-label{font-size:10px;color:#656565;display:inline-flex;align-items:center;gap:5px}
.review-label .icon{width:12px;height:12px}
.action-detail{margin:15px 0 0 28px;padding-left:13px;border-left:2px solid #e8e8e8}
.reason{display:flex;align-items:flex-start;gap:7px;color:#595959;font-size:12px;line-height:1.65}
.reason .icon{width:14px;height:14px;margin-top:3px}
.reason strong{font-weight:550}
.evidence-quote{color:#737373;font-size:12px;line-height:1.7;margin:8px 0 13px}
.evidence-quote .source-link{margin-top:3px}
.inline-fields{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;margin:14px 0}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field-label{font-size:11px;color:#737373}
.field input:not([type="checkbox"]),.field select,.field textarea,.text-input{width:100%;min-height:34px;padding:6px 9px;border:1px solid var(--strong-line);border-radius:4px;background:#fff;outline:none;font-size:12px}
.field textarea{line-height:1.7;min-height:86px}
.field input:focus,.field select:focus,.field textarea:focus,.text-input:focus{border-color:#777;box-shadow:0 0 0 1px #777}
.field input:disabled{background:#f6f6f6;color:#777}
.check-label{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:#6b6b6b;line-height:1.5;cursor:pointer}
.check-label input{width:13px;height:13px;margin:2px 0 0}
.action-detail-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.action-detail-footer .quiet{margin-left:auto}
.quiet{color:#777;font-size:11px}
.action-add{font-size:12px;color:#777;display:flex;align-items:center;gap:7px;padding:12px 0 0 3px}
.action-add .icon{width:14px;height:14px}
.action-add:hover{color:#333}
.decision-row{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:1.7;margin:8px 0}
.decision-row .icon{width:15px;height:15px;margin-top:5px;color:#727272}
.page-footer{padding-top:19px;margin-top:36px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:11px;color:#737373}
.page-footer .icon{width:13px;height:13px}
.page-footer .footer-right{margin-left:auto}
/* Databases */
.database-toolbar{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);margin-top:33px}
.database-toolbar .db-tabs{border:0;margin:0;gap:20px;flex:1}
.database-controls{display:flex;align-items:center;gap:4px;padding-bottom:3px}
.database-controls .btn .icon{width:14px;height:14px}
.database-controls .text-search{width:144px;border:0;background:transparent;outline:none;font-size:12px;padding:3px 3px}
.search-control{display:flex;gap:4px;align-items:center;color:#808080}
.search-control .icon{width:15px;height:15px}
.table-scroll{overflow-x:auto;overscroll-behavior-x:contain}
.database-table{border-collapse:collapse;width:100%;font-size:12px;min-width:690px;table-layout:auto}
.database-table th{font-weight:400;color:#757575;text-align:left;white-space:nowrap;font-size:11px;height:35px;padding:5px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.database-table th:last-child,.database-table td:last-child{border-right:0}
.database-table th:first-child{padding-left:4px}
.col-heading{display:flex;gap:6px;align-items:center}
.col-heading .icon{width:13px;height:13px}
.database-table td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:11px 10px;vertical-align:middle}
.database-table td:first-child{padding-left:4px}
.database-table tbody tr:hover{background:#fafafa}
.database-table .row-name{display:flex;gap:7px;align-items:center;max-width:360px;color:#373737;font-weight:550;text-align:left;line-height:1.5;padding:0}
.database-table .row-name>.icon{color:#909090;width:15px;height:15px}
.database-table .row-name:hover span{text-decoration:underline;text-underline-offset:3px}
.database-table .meeting-name-col{width:40%}
.database-table .person{white-space:nowrap;color:#626262;font-size:11px}
.database-table .date-cell{white-space:nowrap;color:#626262}
.database-table .table-task-meta{font-size:10px;color:#767676;margin-top:3px;font-weight:400}
.database-table .tag{font-size:10px}
.table-add{display:flex;gap:7px;align-items:center;padding:9px 4px;color:#7d7d7d;font-size:12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.table-add .icon{width:14px;height:14px}
.table-add:hover{background:var(--soft)}
.table-footer{font-size:10px;color:#787878;padding:10px 5px;text-align:right}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.filter-row select{border:1px solid var(--line);border-radius:4px;font-size:12px;padding:5px 9px;background:#fafafa;max-width:220px}
.filter-row label{font-size:11px;color:var(--muted)}
.empty-state{text-align:center;padding:66px 18px 60px;border-bottom:1px solid var(--line)}
.empty-state>.icon{width:28px;height:28px;stroke-width:1.4;color:#848484;margin-bottom:14px}
.empty-state h3{font-size:15px;margin-bottom:7px}
.empty-state p{color:var(--muted);font-size:12px;max-width:370px;margin:0 auto 17px;line-height:1.7}
.task-done .row-name>span{color:#888;text-decoration:line-through}
.due-past{border-bottom:1px dotted #777;color:#333;font-weight:600}
body.compact .database-table td{padding-top:7px;padding-bottom:7px}
/* Transcript */
.transcript-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:21px}
.transcript-search{display:flex;align-items:center;gap:8px;flex:1;border:1px solid var(--line);border-radius:5px;padding:6px 9px}
.transcript-search .icon{width:15px;height:15px;color:#888}
.transcript-search input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:12px}
.transcript-search:focus-within{border-color:#999}
.transcript-caption{font-size:11px;color:#7a7a7a;margin-bottom:16px}
.utterance{display:grid;grid-template-columns:46px minmax(0,1fr);gap:11px;padding:15px 0;scroll-margin-top:65px;border-radius:4px}
.utterance.target{background:#f1f1f1;box-shadow:-9px 0 0 #f1f1f1,9px 0 0 #f1f1f1}
.utterance .timestamp{font-size:10px;color:#797979;font-variant-numeric:tabular-nums;padding-top:3px;text-align:left;height:24px}
.utterance .timestamp:hover{color:#222;text-decoration:underline}
.speaker-line{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;line-height:20px}
.speaker-line strong{font-weight:600}
.speaker-line .icon-btn{margin-left:auto;width:23px;height:23px;opacity:0}
.utterance:hover .speaker-line .icon-btn,.utterance:focus-within .speaker-line .icon-btn{opacity:1}
.utterance p{font-size:14px;line-height:1.8}
.utterance mark{background:#dedede;color:inherit;padding:0 1px;border-bottom:1px solid #999}
.audio-block{border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:24px;color:#696969;font-size:11px}
.audio-block>.icon{width:21px;height:21px}
.audio-block audio{width:100%;height:32px;filter:grayscale(1);max-width:500px}
.audio-block .btn{margin-left:auto}
.participant-row{display:flex;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.participant-row>.icon{color:#818181;width:19px;height:19px}
.participant-row strong{font-size:13px;font-weight:550}
.participant-row p{font-size:11px;color:var(--muted);margin-top:2px}
.participant-row .btn{margin-left:auto}
/* Contextual source peek */
.source-panel{position:fixed;inset:47px 0 0 auto;width:var(--source-w);background:#fff;border-left:1px solid #ddd;box-shadow:-8px 0 25px #00000005;z-index:35;display:flex;flex-direction:column;animation:slideIn .17s ease-out}
.source-panel-header{height:49px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 17px;flex-shrink:0}
.source-panel-header strong{font-weight:550;font-size:12px}
.source-panel-header>.icon{width:16px;height:16px;color:#777}
.source-panel-body{padding:27px 26px;overflow:auto;flex:1}
.source-context{font-size:11px;color:#737373;margin-bottom:10px;line-height:1.65}
.source-panel h2{font-size:19px;line-height:1.4;margin-bottom:5px}
.source-panel .utterance{padding:16px 0;grid-template-columns:39px minmax(0,1fr);gap:7px}
.source-panel .utterance p{font-size:13px}
.source-panel .utterance.target{margin-top:16px;margin-bottom:16px;background:#f6f6f6;box-shadow:-12px 0 0 #f6f6f6,12px 0 0 #f6f6f6}
.source-panel .speaker-line{font-size:11px;flex-wrap:wrap}
.source-panel-footer{border-top:1px solid var(--line);padding:13px 17px;color:var(--muted);font-size:11px}
.source-panel-footer .btn{width:100%}
body.source-open .app-shell{margin-right:var(--source-w)}
body.source-open .page{padding-left:40px;padding-right:40px}
body.source-open .topbar .save-status,body.source-open .topbar .crumb-current{display:none}
body.source-open h1{font-size:32px}
.citation-preview{position:fixed;z-index:85;max-width:322px;padding:15px 17px;border:1px solid #e2e2e2;border-radius:6px;background:#fff;box-shadow:var(--shadow);pointer-events:none}
.citation-preview .preview-label{font-size:10px;color:#777;margin-bottom:7px;display:flex;gap:6px;align-items:center}
.citation-preview .preview-label .icon{width:12px;height:12px}
.citation-preview p{font-size:12px;line-height:1.7}
.citation-preview .preview-footer{font-size:10px;color:#777;margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
/* New meeting and process states */
.form-title-input{border:0;outline:0;width:100%;font-size:36px;font-weight:700;letter-spacing:-.8px;line-height:1.3;background:transparent;padding:0;margin-bottom:14px}
.form-title-input::placeholder{color:#b0b0b0}
.form-title-input:focus{box-shadow:none}
.new-form .form-meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0 30px}
.new-form .doc-tabs{margin-top:22px;margin-bottom:18px}
.dropzone{border:1px dashed #cecece;border-radius:6px;padding:36px 20px;text-align:center;background:#fdfdfd}
.dropzone.dragging{background:#efefef;border-color:#777}
.dropzone>.icon{width:31px;height:31px;color:#666;stroke-width:1.35;margin-bottom:14px}
.dropzone h3{font-size:14px;font-weight:550;margin-bottom:5px}
.dropzone p{font-size:11px;color:var(--muted);margin-bottom:16px}
.selected-file{display:flex;align-items:center;gap:13px;padding:16px;border:1px solid var(--line);border-radius:5px;background:#fafafa}
.selected-file>.icon{width:24px;height:24px;stroke-width:1.4;color:#6e6e6e}
.selected-file strong{font-size:12px;display:block;word-break:break-all}
.selected-file p{font-size:11px;color:#757575;margin-top:3px}
.file-error{font-size:12px;line-height:1.7;margin-top:10px;border-left:2px solid #777;padding:8px 12px;background:#f6f6f6}
.form-help{font-size:11px;line-height:1.8;color:var(--muted);margin:13px 0 24px;display:flex;gap:7px;align-items:flex-start}
.form-help .icon{width:13px;height:13px;flex-shrink:0;margin-top:3px}
.form-section{margin:27px 0}
.form-section h3{margin-bottom:8px;font-size:14px}
.form-buttons{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:27px;padding-top:19px;border-top:1px solid var(--line)}
.consent-row{padding:10px 0;font-size:12px;color:#5e5e5e;line-height:1.7}
.recorder{border:1px solid var(--line);border-radius:5px;padding:28px;display:flex;align-items:center;flex-direction:column;gap:10px;background:#fbfbfb}
.record-button{width:56px;height:56px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;margin:4px 0 5px}
.record-button .icon{width:23px;height:23px;stroke-width:1.4}
.record-button.recording{animation:recordPulse 1.4s ease-in-out infinite}
.record-time{font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;letter-spacing:1px}
.process-section{margin-top:29px;border-top:1px solid var(--line);padding-top:24px}
.process-steps{display:grid;gap:19px;margin:25px 0}
.process-step{display:flex;align-items:center;gap:11px;color:#737373;font-size:13px}
.process-step .icon{width:17px;height:17px}
.process-step.done{color:#333}
.process-step.active{color:#222;font-weight:550}
.spinner{animation:spin 1.2s linear infinite}
.process-note{font-size:12px;color:#737373;line-height:1.8;max-width:530px}
/* Modal */
.modal{width:min(530px,calc(100vw - 36px));max-height:min(88dvh,760px);overflow:auto;padding:0;border:1px solid #e4e4e4;border-radius:9px;box-shadow:0 22px 80px #00000024;color:var(--ink)}
.modal::backdrop{background:#00000030}
.modal-header{display:flex;align-items:center;gap:12px;padding:20px 22px 15px}
.modal-header h2{font-size:18px;flex:1}
.modal-body{padding:0 22px 22px}
.modal-description{font-size:12px;color:#727272;line-height:1.8;margin-bottom:20px}
.modal-footer{padding:13px 22px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);background:#fcfcfc}
.modal .field{margin-bottom:14px}
.modal .inline-fields{margin-top:0}
.export-choice{padding:13px 0;border-top:1px solid var(--line)}
.export-choice strong{font-size:13px;font-weight:550}
.export-choice p{font-size:11px;color:#777;margin:4px 0 12px;line-height:1.7}
.export-choice .btn{width:100%}
.history-row{border-left:1px solid #ddd;padding:0 0 20px 15px;margin-left:4px;position:relative}
.history-row:before{content:"";position:absolute;width:5px;height:5px;background:#989898;top:7px;left:-3px;border-radius:50%}
.history-row time{color:#777;font-size:10px}
.history-row p{font-size:12px;margin:4px 0;line-height:1.7}
.setting-row{display:flex;align-items:center;gap:15px;padding:13px 0;border-top:1px solid var(--line)}
.setting-row label{flex:1;font-size:12px}
.setting-row small{font-size:11px;color:#777;display:block;margin-top:3px}
.toggle{appearance:none!important;-webkit-appearance:none!important;width:29px!important;height:17px!important;background:#d6d6d6;border-radius:12px;position:relative;transition:.15s}
.toggle:checked{background:#353535}
.toggle:before{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.15s}
.toggle:checked:before{transform:translateX(12px)}
.search-modal{width:min(580px,calc(100vw - 28px))}
.search-modal .modal-header{padding:15px 16px;border-bottom:1px solid var(--line);gap:9px}
.command-input{width:100%;border:0;outline:0;font-size:15px;background:transparent}
.search-results{padding:6px}
.command-result{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:5px}
.command-result:hover,.command-result:focus-visible{background:#f3f3f3}
.command-result .icon{width:17px;height:17px;color:#777}
.command-result strong{font-size:12px;font-weight:500}
.command-result p{font-size:10px;color:#777;margin-top:2px}
.search-hint{font-size:10px;color:#777;padding:9px 17px;border-top:1px solid var(--line);display:flex;gap:10px}
.command-label{font-size:10px;color:#777;padding:10px 17px 2px}
.toast{position:fixed;bottom:24px;left:calc(50% + 100px);transform:translateX(-50%);display:flex;align-items:center;gap:9px;background:#252525;color:#fff;padding:11px 15px;border-radius:6px;box-shadow:var(--shadow);font-size:12px;z-index:130;max-width:min(500px,90vw)}
.toast .icon{width:15px;height:15px;flex-shrink:0}
.demo-notice{font-size:11px;line-height:1.8;color:#777;background:#f7f7f7;padding:12px;border-radius:5px;margin-bottom:17px}
body.wide .page:not(.form-page){max-width:1400px}
@keyframes slideIn{from{transform:translateX(15px);opacity:.5}to{transform:translateX(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes recordPulse{50%{box-shadow:0 0 0 6px #dedede}}
@media(min-width:1550px){.page{padding-top:65px}}
@media(max-width:1230px){
  :root{--sidebar-w:214px;--source-w:370px}
  .page{padding-left:38px;padding-right:38px}
  .page.database-page{padding-left:36px;padding-right:36px}
  .save-status{display:none}
  .database-controls .text-search{width:95px}
  body.source-open .page{padding-left:27px;padding-right:27px}
  body.source-open .property{grid-template-columns:119px 1fr}
  body.source-open .doc-tabs{gap:13px}
  body.source-open .review-callout{flex-wrap:wrap;gap:7px}
}
@media(max-width:1000px){
  body.source-open .app-shell{margin-right:0}
  .source-panel{box-shadow:-15px 0 45px #00000012;width:410px}
  .database-toolbar{flex-wrap:wrap;gap:8px}
  .database-toolbar .db-tabs{flex-basis:100%}
  .database-controls{width:100%;padding-bottom:9px}
  .database-controls .search-control{flex:1}
  .database-controls .text-search{width:100%}
  .crumb-current{max-width:190px}
  .page{padding-top:43px}
  h1{font-size:34px}
}

  .app-shell{margin-left:0!important}
  .desktop-open-sidebar{display:none!important}
  .mobile-toggle{display:inline-flex}

  .topbar-tools .btn{padding:5px 7px;font-size:11px}

  .page,.page.database-page{padding:32px 24px 65px;max-width:700px}
  .page-icon{margin-bottom:15px}
  .page-icon .icon{width:36px;height:36px}
  .page-icon{height:38px}
  h1{font-size:32px;letter-spacing:-.7px;line-height:1.22}
  h2{font-size:18px}
  .property{grid-template-columns:129px minmax(0,1fr);font-size:12px}
  .properties{margin-top:22px;margin-bottom:20px}
  .property-value.is-button{font-size:12px}
  .review-callout{padding:11px 12px;flex-wrap:wrap;margin:20px 0;font-size:12px;gap:8px}
  .review-callout>.grow{flex-basis:calc(100% - 32px)}
  .review-callout>.btn{margin-left:26px;min-height:24px;padding:3px 0}
  .doc-tabs{gap:18px;margin-bottom:24px}
  .doc-tabs .right-hint{display:none}
  .tab{font-size:12px}
  .doc-text{font-size:14px;line-height:1.85}
  .action-meta{column-gap:10px;row-gap:7px}
  .action-title{font-size:14px}
  .action-detail{padding-left:11px;margin-left:22px}
  .item-index{display:none}
  .inline-fields{gap:10px}
  .block-grip{display:none}
  .section-heading .section-actions .icon-btn,.speaker-line .icon-btn{opacity:1!important}
  .page-footer{align-items:flex-start;flex-wrap:wrap}
  .page-footer .footer-right{margin-left:0;width:100%;padding-left:22px}
  .source-panel{width:100%;inset:0;z-index:90;box-shadow:none;max-height:100dvh}
  .source-panel-header{height:51px;padding:0 17px}
  .source-panel-body{padding:25px 30px}
  .source-panel-footer{padding-bottom:max(13px,env(safe-area-inset-bottom))}
  body.source-open{overflow:hidden}
  body.source-open .page{padding-left:24px;padding-right:24px}
  .source-panel .utterance p{font-size:15px}
  .source-panel .speaker-line{font-size:12px}
  .citation-preview{display:none!important}
  .toast{left:50%;bottom:20px;width:max-content;max-width:calc(100vw - 28px);font-size:11px}
  .database-toolbar{margin-top:26px}
  .database-toolbar .db-tabs{gap:17px;overflow-x:auto}
  .database-controls .btn{font-size:11px}
  .table-scroll{margin-right:-24px;padding-right:24px}
  .database-table{min-width:730px}
  .form-title-input{font-size:31px}
  .new-form .form-meta{gap:13px}
  .form-title-input{margin-top:5px}
  .modal{max-height:87dvh}
  .modal-header{padding:18px 18px 13px}
  .modal-body{padding:0 18px 18px}
  .modal-footer{padding:12px 18px}
  .audio-block{flex-wrap:wrap}

}
@media(max-width:420px){
  .page,.page.database-page{padding-left:20px;padding-right:20px}

  .properties .property{grid-template-columns:120px 1fr}
  .inline-fields{grid-template-columns:1fr}
  .property-value{padding-left:1px}
  .section-heading{gap:6px}
  .action-detail-footer .quiet{width:100%;margin-left:0;margin-top:4px}
  .database-toolbar .db-tabs{gap:15px}
  .db-tabs .tab .icon{display:none}
  .db-tabs .tab{font-size:11px}
  .new-form .form-meta{grid-template-columns:1fr}
  .transcript-toolbar{flex-wrap:wrap}
}

  .source-link{color:#333;background:#f3f3f3}
}

function renderTasks(){const overdue=allTasks().filter(t=>t.verified&&!t.done&&t.due&&t.due<DEMO_TODAY).length;return `<section class="page database-page"><div class="page-icon">${icon('checkSquare')}</div><h1>Поручения</h1><p class="page-description">Исполнители, сроки и договорённости из ваших совещаний.</p><div class="database-toolbar"><div class="db-tabs" role="tablist" aria-label="Представление поручений">${[['active','list','В работе'],['overdue','clock',`Просрочены${overdue?' '+overdue:''}`],['draft','circleDashed','Черновики'],['done','check','Выполнены']].map(([key,ico,title])=>`<button class="tab" role="tab" aria-selected="${taskFilter===key}" data-action="task-filter" data-filter="${key}">${icon(ico)}${title}</button>`).join('')}</div><div class="database-controls"><label class="search-control">${icon('search')}<input id="taskQuery" class="text-search" type="search" value="${esc(taskQuery)}" placeholder="Поиск…" aria-label="Поиск поручений"></label>${iconBtn('Фильтры поручений','toggle-task-filters','filter',`aria-expanded="${filterPanel}"`,filterPanel?'is-on':'')}</div></div>

function taskTable(){const rows=allTasks().filter(t=>{const tab=taskFilter==='draft'?!t.verified:taskFilter==='done'?t.verified&&t.done:taskFilter==='overdue'?t.verified&&!t.done&&t.due&&t.due<DEMO_TODAY:t.verified&&!t.done;return tab&&(!taskOwner||t.owner===taskOwner)&&(!taskMeeting||t.meetingId===taskMeeting)&&(`${t.title} ${t.owner} ${t.meetingTitle}`).toLowerCase().includes(taskQuery.toLowerCase())}).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));

function captureNewDraft(){const f=$('#newMeetingForm');if(!f)return;newDraft={title:f.elements.title.value,date:f.elements.date.value,participants:f.elements.participants.value,consent:f.elements.consent.checked}}
function showFileError(message){const el=$('#fileError');if(el){el.textContent=message;el.hidden=false}else toast(message,'alert')}
function validateFile(file){if(!file)return 'Файл не выбран.';if(!file.size)return 'Файл пустой. Выберите запись, которая содержит аудио.';if(file.size>250*1024*1024)return 'Файл больше 250 МБ. Выберите меньший файл для локального прототипа.';if(!/\.(mp3|m4a|wav|ogg|webm|aac)$/i.test(file.name))return 'Этот формат не поддерживается. Выберите MP3, M4A, WAV, OGG, AAC или WEBM.';return ''}
async function chooseAudio(file){const error=validateFile(file);if(error){showFileError(error);return}selectedFile=file;$('#fileError')&&( $('#fileError').hidden=true);updateFileUI();const probe=document.createElement('audio');const url=URL.createObjectURL(file);probe.preload='metadata';probe.onloadedmetadata=()=>{if(selectedFile===file&&Number.isFinite(probe.duration)){selectedFile._duration=probe.duration;updateFileUI()}URL.revokeObjectURL(url)};probe.onerror=()=>URL.revokeObjectURL(url);probe.src=url;setTimeout(()=>URL.revokeObjectURL(url),10000)}
function updateFileUI(){const el=$('#selectedFile');if(!el)return;el.hidden=!selectedFile;const drop=$('#dropzone');if(drop)drop.hidden=!!selectedFile;if(!selectedFile)return;el.innerHTML=`${icon('wave')}<div class="grow"><strong>${esc(selectedFile.name)}</strong><p>${(selectedFile.size/1048576).toLocaleString('ru-RU',{maximumFractionDigits:1})} МБ${selectedFile._duration?' · '+timeLabel(selectedFile._duration):''} · выбран локально</p></div>${iconBtn('Скачать выбранную запись','download-audio','download')}${iconBtn('Удалить выбранный файл','remove-file','close')}`}
async function toggleRecord(){

/* A small STORE-mode ZIP writer creates a real Office Open XML .docx offline. */
const crcTable=(()=>{const out=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;out[n]=c>>>0}return out})();
function crc32(bytes){let crc=0xffffffff;for(const b of bytes)crc=crcTable[(crc^b)&255]^(crc>>>8);return (crc^0xffffffff)>>>0}

  if(draft)body+=p('Документ является черновиком. Неподтверждённые предложения отмечены как «Не проверено».','Quote');

  body+=p('Решения','Heading1');m.decisions.forEach((d,j)=>{body+=p(`${j+1}. ${d.verified?'':'[Не проверено] '}${d.text}`)});if(!m.decisions.length)body+=p('Отдельные решения не выделены.');

  const relDoc='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>';

  return zipStore([['[Content_Types].xml',contentTypes],['_rels/.rels',relRoot],['word/document.xml',doc],['word/styles.xml',styles],['word/_rels/document.xml.rels',relDoc],['word/footer1.xml',foot]]);

document.addEventListener('submit',event=>{

    case 'text-edit':{const item=form.dataset.kind==='summary'?m.summary:m.decisions.find(d=>d.id===form.dataset.id);if(!data.text.trim()){form.elements.text.setCustomValidity('Введите формулировку.');form.elements.text.reportValidity();return}item.text=data.text.trim();item.verified=!!data.verified;log(m,`${ME} изменила ${form.dataset.kind==='summary'?'краткое содержание':'решение'}${item.verified?' и подтвердила текст':'. Требуется проверка'}.`);save();closeModal();refresh();toast('Текст сохранён.');break}
    case 'task-edit':{if(!data.title.trim()){form.elements.title.setCustomValidity('Введите формулировку.');form.elements.title.reportValidity();return}const existing=form.dataset.id?m.tasks.find(t=>t.id===form.dataset.id):null;const source=data.source?(existing?.source?.[0]===data.source?existing.source:[data.source]):[];const props={title:data.title.trim(),owner:data.owner||'',due:data.due||'',noDue:false,verified:false,source,manualReason:data.manualReason.trim(),reason:'Формулировка изменена пользователем. Проверьте исполнителя и срок.'};if(existing)Object.assign(existing,props);else m.tasks.push({...props,id:uid('task'),done:false,origin:'manual'});log(m,`${ME} ${existing?'изменила':'добавила'} поручение «${props.title}». Требуется проверка.`);save();closeModal();refresh();toast('Поручение сохранено как черновик.');break}
    case 'person':{const person=m.people[Number(form.dataset.index)];const old=person.name,name=data.name.trim();if(!name){form.elements.name.setCustomValidity('Введите имя.');form.elements.name.reportValidity();return}if(m.people.some(p=>p!==person&&p.name===name)){form.elements.name.setCustomValidity('Участник с этим именем уже есть.');form.elements.name.reportValidity();return}person.name=name;person.role=data.role.trim();if(old!==name){m.transcript.forEach(s=>{if(s.speaker===old)s.speaker=name});m.tasks.forEach(t=>{if(t.owner===old){t.owner=name;t.verified=false;t.reason='Имя участника изменено. Подтвердите исполнителя повторно.'}})}log(m,`${ME} изменила участника: ${old} → ${name}.`);save();closeModal();refresh();if(sourceState)renderSource();toast('Данные участника обновлены.');break}
    case 'utterance':{const s=m.transcript.find(s=>s.id===form.dataset.id);if(!data.text.trim()){form.elements.text.setCustomValidity('Введите текст реплики.');form.elements.text.reportValidity();return}const old=s.text;s.text=data.text.trim();s.speaker=data.speaker;s.lang=data.lang;m.tasks.forEach(t=>{if(t.source.includes(s.id)){t.verified=false;t.reason='Исходная реплика изменена. Проверьте поручение повторно.'}});m.decisions.forEach(d=>{if(d.source.includes(s.id))d.verified=false});if(m.summary.source.includes(s.id))m.summary.verified=false;log(m,`${ME} исправила реплику ${timeLabel(s.at)}: «${old}» → «${s.text}».`);save();closeModal();refresh();if(sourceState)renderSource();toast('Реплика обновлена. Связанные предложения требуют проверки.');break}

  if(el.id==='taskQuery'){taskQuery=el.value;$('#taskTable').innerHTML=taskTable()}
  if(el.id==='globalSearch')updateSearch(el.value);
  if(el.id==='transcriptQuery'){const m=meeting(),q=el.value.trim();const rows=m.transcript.filter(s=>(s.text+' '+s.speaker).toLowerCase().includes(q.toLowerCase()));$('#transcriptList').innerHTML=rows.map(s=>utterance(m,s,false,q)).join('')||'<div class="empty-state"><p>Совпадений нет. Попробуйте другой запрос.</p></div>';$('#transcriptCount').textContent=`${rows.length} из ${m.transcript.length} реплик`}
  if(el.closest('#newMeetingForm'))captureNewDraft();
});
document.addEventListener('change',event=>{
  const el=event.target;if(el.setCustomValidity)el.setCustomValidity('');
  if(el.id==='fileInput'&&el.files?.[0])chooseAudio(el.files[0]);
  if(el.id==='consent')captureNewDraft();
  if(el.name==='noDue'){const input=el.closest('form').elements.due;input.disabled=el.checked;input.setCustomValidity('')}
  if(el.id==='taskOwner'){taskOwner=el.value;$('#taskTable').innerHTML=taskTable()}
  if(el.id==='taskMeeting'){taskMeeting=el.value;$('#taskTable').innerHTML=taskTable()}
  if(el.id==='wideSetting'||el.id==='compactSetting'){state.settings[el.id==='wideSetting'?'wide':'compact']=el.checked;save();refresh()}
  if(el.matches('.completion-box')){const m=meeting(el.dataset.meeting),t=m?.tasks.find(t=>t.id===el.dataset.task);if(!t||!t.verified)return;t.done=el.checked;log(m,`${ME} ${t.done?'отметила выполнение':'вернула в работу'} поручения «${t.title}».`);save();refresh();toast(t.done?'Поручение перемещено во вкладку «Выполнены».':'Поручение возвращено в работу.')}
  if(el.id==='attachmentInput'&&el.files?.[0]){const file=el.files[0],error=validateFile(file);if(error){toast(error,'alert');el.value='';return}const m=meeting(el.dataset.meeting);if(!m)return;const prev=audioFiles.get(m.id);if(prev)URL.revokeObjectURL(prev.url);audioFiles.set(m.id,{url:URL.createObjectURL(file),name:file.name});log(m,'Аудиофайл прикреплён локально. Синхронизация с текстом не проверялась.');save();refresh();if(sourceState)renderSource();el.value='';toast('Аудио прикреплено к текущей вкладке.')}
});
['dragenter','dragover'].forEach(type=>document.addEventListener(type,e=>{const zone=e.target.closest('#dropzone');if(zone){e.preventDefault();zone.classList.add('dragging')}}));
document.addEventListener('dragleave',e=>{const zone=e.target.closest('#dropzone');if(zone&&!zone.contains(e.relatedTarget))zone.classList.remove('dragging')});
document.addEventListener('drop',e=>{const zone=e.target.closest('#dropzone');if(zone){e.preventDefault();zone.classList.remove('dragging');if(e.dataTransfer.files.length)chooseAudio(e.dataTransfer.files[0])}});
let previewTimer;
document.addEventListener('mouseover',e=>{const b=e.target.closest('[data-source-ids]');if(b){clearTimeout(previewTimer);previewTimer=setTimeout(()=>showCitationPreview(b),280)}});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-source-ids]')){clearTimeout(previewTimer);$('#citationPreview').hidden=true}});
document.addEventListener('focusin',e=>{const b=e.target.closest('[data-source-ids]');if(b)showCitationPreview(b)});
document.addEventListener('focusout',e=>{if(e.target.closest('[data-source-ids]'))$('#citationPreview').hidden=true});
document.addEventListener('keydown',event=>{
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch();return}
  if((event.ctrlKey||event.metaKey)&&event.key==='\\'){event.preventDefault();toggleSidebar();return}
  if(event.key==='Escape'&&!$('#modal').open){closeSource();closeSidebar();if($('#pageMenu'))$('#pageMenu').hidden=true;$('#citationPreview').hidden=true}
  if(event.key==='Tab'&&sourceState&&innerWidth<=760&&!$('#modal').open){const focusable=$$('button,input,select,textarea,a[href]', $('#sourcePanel')).filter(el=>!el.disabled&&!el.hidden);const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}
  if(['ArrowLeft','ArrowRight'].includes(event.key)&&event.target.matches('[role="tab"]')){const tabs=$$('[role="tab"]',event.target.closest('[role="tablist"]')),current=tabs.indexOf(event.target),next=tabs[(current+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];event.preventDefault();const ds={...next.dataset};next.click();const selector=`[data-action="${ds.action}"]${ds.tab?`[data-tab="${ds.tab}"]`:ds.filter?`[data-filter="${ds.filter}"]`:''}`;$(selector)?.focus()}
});
$('#sidebarScrim').addEventListener('click',closeSidebar);
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal()}});
window.addEventListener('hashchange',()=>{parseRoute();closeSource();if(route.id!=='m4'){clearInterval(processTimer);processTimer=null}render();window.scrollTo({top:0,behavior:'instant'})});
window.addEventListener('beforeunload',event=>{if(mediaRecorder?.state==='recording'){event.preventDefault();event.returnValue=''}});
window.addEventListener('pagehide',()=>{mediaStream?.getTracks().forEach(t=>t.stop());audioFiles.forEach(a=>URL.revokeObjectURL(a.url))});
parseRoute();applySettings();render();
</script>
</body>
</html>
