services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taldau
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - taldau-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taldau"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taldau-postgres-data:
